    // --- MODULE 01: OVERVIEW & RADAR SWEEP ---
    function OverviewModule({ onNavigate }) {
      const canvasRef = useRef(null);

      // Radar Sweep Animation
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let angle = 0;
        let animationFrameId;

        // Mock Satellite Brands
        const satellites = [
          { x: 120, y: 80, label: 'Astraea Inc', status: 'IN ORBIT' },
          { x: 220, y: 190, label: 'Hyperion AI', status: 'STAGE 2' },
          { x: 80, y: 200, label: 'Apex Summit 2026', status: 'IGNITION' },
          { x: 260, y: 90, label: 'Nebula Pay', status: 'PAYLOAD DEPLOYED' }
        ];

        const render = () => {
          const width = canvas.width;
          const height = canvas.height;
          const cX = width / 2;
          const cY = height / 2;
          const radius = Math.min(cX, cY) - 10;

          ctx.clearRect(0, 0, width, height);

          // Grid Circles
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1;
          for (let r = 40; r <= radius; r += 40) {
            ctx.beginPath();
            ctx.arc(cX, cY, r, 0, Math.PI * 2);
            ctx.stroke();
          }

          // Crosshairs
          ctx.beginPath();
          ctx.moveTo(cX, 0); ctx.lineTo(cX, height);
          ctx.moveTo(0, cY); ctx.lineTo(width, cY);
          ctx.stroke();

          // Radar Line
          ctx.save();
          ctx.translate(cX, cY);
          ctx.rotate(angle);
          const gradient = ctx.createConicGradient(0, 0, 0);
          gradient.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
          gradient.addColorStop(0.1, 'rgba(0, 240, 255, 0.0)');
          gradient.addColorStop(1, 'rgba(0, 240, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#00f0ff';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(radius, 0);
          ctx.stroke();
          ctx.restore();

          // Render Satellites
          satellites.forEach(sat => {
            ctx.fillStyle = '#00ff66';
            ctx.beginPath();
            ctx.arc(sat.x, sat.y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#a0aec0';
            ctx.font = '9px "JetBrains Mono"';
            ctx.fillText(`${sat.label} [${sat.status}]`, sat.x + 8, sat.y + 3);
          });

          angle += 0.02;
          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

    // --- MODULE 04: GEMINI AI FLIGHT DIRECTOR ---
    function AiDirectorModule() {
      const [brandName, setBrandName] = useState('');
      const [productDesc, setProductDesc] = useState('');
      const [loading, setLoading] = useState(false);
      const [planOutput, setPlanOutput] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const generateStrategy = async () => {
        if (!brandName.trim()) {
          setErrorMsg('PLEASE INPUT A BRAND NAME OR CODENAME');
          return;
        }

        setLoading(true);
        setErrorMsg('');
        setPlanOutput('');

        const promptText = `
You are the Groom Lake Test Facility Flight Director for Brand Strategy at Sixth Sigma Solutions.
Formulate a highly technical, high-impact Groom Lake-style Brand Launch Mission Operations Plan for:

BRAND NAME: ${brandName}
PRODUCT/MISSION OBJECTIVE: ${productDesc || 'General market disruption and brand launch'}

Structure the response like an official Groom Lake Test Facility Mission Telemetry Manual from Sixth Sigma Solutions:
1. T-MINUS 60 DAYS: BRAND DNA SEQUENCING (Graphic Design & Identity)
2. T-MINUS 30 DAYS: SIGNAL INTERCEPT CAMPAIGNS (Marketing & Telemetry)
3. T-MINUS 0 COUNTDOWN: IGNITION & STAGING (Event Command & Public Launch)
4. POST-LAUNCH ORBITAL VERIFICATION (Analytics & Scaling)

Keep the language crisp, technical, aerospace-inspired, and authoritative. Max 350 words.
        `;

        const apiKey = ""; // Runtime provided key
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        let attempt = 0;
        const delays = [1000, 2000, 4000, 8000];

        while (attempt < 5) {
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });

            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                setPlanOutput(text);
                setLoading(false);
                return;
              }
            }
          } catch (e) {
            console.error('Retrying Gemini API call...', e);
          }
          
          attempt++;
          if (attempt < 5) await new Promise(r => setTimeout(r, delays[attempt - 1]));
        }

        setLoading(false);
        setErrorMsg('SYSTEM ERROR: UNABLE TO CONTACT GEMINI TELEMETRY ORBIT. PLEASE RETRY.');
      };

      return (
        <div class="space-y-6 font-mono">
          <div class="border-b border-nasa-panelBorder pb-4">
            <h2 class="text-2xl font-bold text-white flex items-center gap-2">

          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* INPUT PANEL */}
            <div class="lg:col-span-5 bg-nasa-panel border border-nasa-panelBorder p-6 rounded space-y-4 tech-corner">
              <div class="text-xs font-bold text-nasa-accent border-b border-slate-800 pb-2">
                [INPUT MISSION PARAMETERS]
              </div>

              <div>
                <label class="text-xs text-gray-300 font-bold block mb-1">BRAND / ENTITY CODENAME *</label>
                <input 
                  type="text" 
                  value={brandName}
                  onChange={(e) => setBrandName(e.target.value)}
                  placeholder="e.g. ASTRAEA AI / PROJECT NEBULA"
                  class="w-full bg-black/80 border border-slate-700 rounded px-3 py-2 text-xs text-nasa-accent focus:border-nasa-accent outline-none"
                />
              </div>

              <div>

                <textarea 
                  rows={4}

                ></textarea>
              </div>

              {errorMsg && (
                <div class="text-xs text-nasa-red bg-nasa-red/10 border border-nasa-red/40 p-2 rounded">
                  {errorMsg}
                </div>
              )}

              <button 
                onClick={generateStrategy}
                disabled={loading}
                class="w-full bg-nasa-accent hover:bg-cyan-300 text-black font-extrabold py-3 rounded text-xs transition-all flex justify-center items-center gap-2 glow-cyan"
              >
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>{loading ? 'COMPUTING LAUNCH TRAJECTORY...' : 'GENERATE FLIGHT MANUAL'}</span>
              </button>
            </div>

            {/* OUTPUT TELEMETRY DISPLAY */}

                  <div class="w-10 h-10 border-2 border-nasa-accent border-t-transparent rounded-full animate-spin"></div>

                    SYNTHESIZING STRATEGIC FLIGHT PLAN...

                </div>
              ) : planOutput ? (

                  <select class="w-full bg-black/80 border border-slate-700 rounded px-3 py-2 text-xs text-nasa-accent focus:border-nasa-accent outline-none">
                    <option>ALL MODULES (FULL LAUNCH)</option>
                    <option>MOD-01 Graphic & Identity DNA</option>
                    <option>MOD-02 Strategic Marketing</option>
                    <option>MOD-04 Event Ground Control</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="text-xs text-gray-300 font-bold block mb-1">MISSION DIRECTIVES & TARGET ORBIT *</label>
                <textarea required rows={4} placeholder="Outline your launch goals, target timeline, and primary directives..." class="w-full bg-black/80 border border-slate-700 rounded px-3 py-2 text-xs text-nasa-accent focus:border-nasa-accent outline-none"></textarea>
              </div>

              <button 
                type="submit"
                class="w-full bg-nasa-accent hover:bg-cyan-300 text-black font-extrabold py-3 rounded text-xs transition-all flex justify-center items-center gap-2 glow-cyan"
              >
                <i data-lucide="radio" class="w-4 h-4"></i>
                <span>TRANSMIT BRIEF TO GROUND CONTROL</span>
              </button>
            </form>
          )}
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize Lucide Icons after render
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 100);
  </script>
</body>
